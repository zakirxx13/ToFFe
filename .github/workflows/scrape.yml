name: Toffee Live Scraper

on:
  schedule:
    - cron: '0 */4 * * *'  # প্রতি ৪ ঘণ্টায়
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Run Toffee Scraper
      run: python scraper/toffee_scraper.py
    
    - name: Commit playlist
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add output/
        git diff --staged --quiet || git commit -m "Update Toffee playlist - $(date '+%Y-%m-%d %H:%M')"
        git push
